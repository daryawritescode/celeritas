name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    - name: Install Poetry
      run: curl -sSL https://install.python-poetry.org | python3 -
    - name: Install Dependencies
      run: poetry install
    - name: Run Linters
      run: |
        poetry run ruff check src tests
        poetry run mypy src tests
    - name: Run Tests
      # Assuming running tests might require network access which is fine in GitHub Actions
      run: poetry run pytest --cov=src --cov-report=term-missing
