name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build Dev Container
      run: docker compose build --build-arg INSTALL_DEV=true dev
    - name: Ruff Check
      run: docker compose run --rm dev poetry run ruff check .
    - name: Mypy
      run: docker compose run --rm dev poetry run mypy src tests

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v4
    - name: Build Dev Container
      run: docker compose build --build-arg INSTALL_DEV=true dev
    - name: Run Tests
      run: docker compose run --rm dev poetry run pytest --cov=src --cov-report=term-missing

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
    - name: Build Production Image
      run: docker compose build celeritas
