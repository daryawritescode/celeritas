services:
  celeritas:
    build:
      context: .
      args:
        INSTALL_DEV: "false"
    ports: []
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.celeritas.rule=Host(`celeritas.localhost`)"
      - "traefik.http.routers.celeritas.entrypoints=web"
      - "traefik.http.services.celeritas.loadbalancer.server.port=8000"
    volumes:
      - ./data:/app/data
    environment:
      - CELERITAS_DB_PATH=/app/data/celeritas.db
      - CELERITAS_PORT=8000
    restart: unless-stopped

  dev:
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    volumes:
      - ./data:/app/data
    environment:
      - CELERITAS_DB_PATH=/app/data/celeritas.db
      - CELERITAS_PORT=8000

networks:
  proxy:
    name: atriensis_default
    external: true
