services:
  celeritas:
    build:
      context: .
      args:
        INSTALL_DEV: "false"
    ports: []
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.celeritas.rule=Host(`celeritas.localhost`)"
      - "traefik.http.routers.celeritas.entrypoints=web"
      - "traefik.http.services.celeritas.loadbalancer.server.port=80"
    volumes:
      - ./data:/app/data
    environment:
      - CELERITAS_DB_PATH=/app/data/celeritas.db
      - CELERITAS_PORT=80
    restart: unless-stopped


  dev:
    profiles: ["dev"]
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    volumes:
      - .:/app
      - /app/.venv
      - ./data:/app/data
    environment:
      - CELERITAS_DB_PATH=/app/data/dev.db
      - CELERITAS_PORT=80

  scheduler:
    extends: celeritas
    command: poetry run celeritas schedule
    profiles: ["scheduler"]
    restart: unless-stopped
    environment:
      - CELERITAS_DB_PATH=/app/data/celeritas.db
      - CELERITAS_SCHEDULE_INTERVAL
    volumes:
      - .:/app
      - /app/.venv
      - ./data:/app/data

networks:
  proxy:
    name: proxy-network
    external: true
