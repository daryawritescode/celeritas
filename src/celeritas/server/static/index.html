<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celeritas Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="glass-container main-wrapper">
        <header>
            <div class="logo">
                <div class="logo-title">
                    <h1>Celeritas</h1>
                    <p class="tagline">Lightning-fast network diagnostics</p>
                </div>
                <div class="pulse-ring" id="status-ring"></div>
            </div>
            <div class="header-actions">
                <div class="nav-links">
                    <a href="/docs" class="nav-link" target="_blank" title="Documentation">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                        <span>Docs</span>
                    </a>
                    <a href="https://github.com/daryawritescode/celeritas" target="_blank" class="repo-link" title="View Source">
                        <svg height="20" width="20" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path></svg>
                        <span>GitHub</span>
                    </a>
                </div>
                <button id="runTestBtn" class="btn-primary">Run Test</button>
            </div>
        </header>

        <section class="results-section">
            <h2 id="results-header">Last Test Results</h2>
            <!-- Live Test Chart -->
            <div class="live-chart-container" id="live-chart-wrapper" style="display: none;">
                <canvas id="liveChart"></canvas>
                <div class="progress-info">
                    <span id="progress-msg">Idle</span>
                    <div class="progress-bar-bg">
                        <div class="progress-bar" id="progress-bar"></div>
                    </div>
                </div>
            </div>
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Download</h3>
                    <div class="value" id="val-download">-- <span>Mbps</span></div>
                </div>
                <div class="stat-card">
                    <h3>Upload</h3>
                    <div class="value" id="val-upload">-- <span>Mbps</span></div>
                </div>
                <div class="stat-card">
                    <h3>Ping</h3>
                    <div class="value" id="val-ping">-- <span>ms</span></div>
                </div>
                <div class="stat-card" title="Gateway: Local router latency / DNS: Domain name resolution time">
                    <h3>Gateway / DNS</h3>
                    <div class="value" id="val-network">-- <span>/</span> -- <span>ms</span></div>
                </div>
            </div>
            <div class="telemetry-panel">
                <div class="telemetry-item">
                    <span class="telemetry-label">Public IP</span>
                    <span class="telemetry-value" id="val-public-ip">--</span>
                </div>
                <div class="telemetry-divider"></div>
                <div class="telemetry-item">
                    <span class="telemetry-label">Location</span>
                    <span class="telemetry-value" id="val-location">--</span>
                </div>
                <div class="telemetry-divider"></div>
                <div class="telemetry-item">
                    <span class="telemetry-label">Container IP</span>
                    <span class="telemetry-value" id="val-container-ip">--</span>
                </div>
                <div class="telemetry-divider"></div>
                <div class="telemetry-item">
                    <span class="telemetry-label">Host IP</span>
                    <span class="telemetry-value" id="val-host-ip">--</span>
                </div>
            </div>
        </section>
        
        <section class="history-section">
            <h2>Past Results</h2>
            <div class="chart-container">
                <canvas id="historyChart"></canvas>
            </div>
        </section>
    </div>
    <script src="/static/script.js"></script>
</body>

</html>
